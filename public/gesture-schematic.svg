<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" className="w-full h-auto">
  <defs>
    <!-- Grid pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a3e635"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="#090d16" rx="16"/>
  <rect width="900" height="480" fill="url(#grid)" rx="16"/>

  <!-- Title Badge -->
  <g transform="translate(30, 26)">
    <rect width="320" height="28" rx="6" fill="rgba(163, 230, 53, 0.1)" stroke="rgba(163, 230, 53, 0.25)" stroke-width="1"/>
    <text x="12" y="18" fill="#a3e635" font-family="monospace" font-size="11" font-weight="600">
      PROTEUS VSM · CIRCUIT SCHEMATIC SPECIFICATION
    </text>
  </g>
  <text x="870" y="44" fill="#64748b" font-family="monospace" font-size="11" text-anchor="end">
    Rev 1.2 · 5V TTL LOGIC
  </text>

  <!-- 1. SENSOR STAGE: ADXL335 -->
  <g transform="translate(40, 90)">
    <rect width="190" height="280" rx="12" fill="url(#boxGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
    <!-- Header -->
    <path d="M 0 12 Q 0 0 12 0 L 178 0 Q 190 0 190 12 L 190 40 L 0 40 Z" fill="rgba(56, 189, 248, 0.12)"/>
    <text x="16" y="25" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">ADXL335</text>
    <text x="16" y="36" fill="#94a3b8" font-family="sans-serif" font-size="9">3-AXIS ACCELEROMETER</text>

    <!-- Pin details -->
    <g transform="translate(16, 60)" font-family="monospace" font-size="11" fill="#cbd5e1">
      <text y="20" fill="#f87171">VCC (3.3V)</text>
      <text y="50" fill="#64748b">GND</text>
      <text y="80" fill="#38bdf8">X-OUT (Tilt)</text>
      <text y="110" fill="#38bdf8">Y-OUT (Roll)</text>
      <text y="140" fill="#64748b">Z-OUT (NC)</text>
      <text y="170" fill="#a3e635">ST (Self-Test)</text>
    </g>

    <!-- Signal condition note -->
    <rect x="12" y="240" width="166" height="28" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
    <text x="20" y="258" fill="#94a3b8" font-family="monospace" font-size="10">Analog ADC (0–3.3V)</text>
  </g>

  <!-- Wires from Sensor to MCU -->
  <path d="M 230 170 L 310 170" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="270" y="162" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">A0 (X)</text>

  <path d="M 230 200 L 310 200" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="270" y="192" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">A1 (Y)</text>

  <!-- 2. MCU STAGE: ATmega328P -->
  <g transform="translate(315, 80)">
    <rect width="250" height="300" rx="12" fill="url(#boxGrad)" stroke="rgba(163, 230, 53, 0.4)" stroke-width="1.5"/>
    <path d="M 0 12 Q 0 0 12 0 L 238 0 Q 250 0 250 12 L 250 42 L 0 42 Z" fill="rgba(163, 230, 53, 0.12)"/>
    <text x="16" y="26" fill="#a3e635" font-family="monospace" font-size="14" font-weight="700">ATMEGA328P / ARDUINO</text>
    <text x="16" y="38" fill="#94a3b8" font-family="sans-serif" font-size="9">16MHz CORE · 10-BIT ADC</text>

    <!-- Embedded Firmware Logic Sub-box -->
    <rect x="16" y="55" width="218" height="110" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(163, 230, 53, 0.2)"/>
    <text x="26" y="75" fill="#a3e635" font-family="monospace" font-size="10" font-weight="600">FIRMWARE PIPELINE:</text>
    <text x="26" y="95" fill="#cbd5e1" font-family="sans-serif" font-size="10">1. ADC Dual-Axis Sampling</text>
    <text x="26" y="115" fill="#cbd5e1" font-family="sans-serif" font-size="10">2. Deadband Filter (±30 LSB jitter suppression)</text>
    <text x="26" y="135" fill="#cbd5e1" font-family="sans-serif" font-size="10">3. Differential Steering Matrix</text>
    <text x="26" y="153" fill="#cbd5e1" font-family="sans-serif" font-size="10">4. 8-Bit PWM Timer Generator</text>

    <!-- Output Pin list -->
    <g transform="translate(16, 185)" font-family="monospace" font-size="11" fill="#cbd5e1">
      <text y="16" fill="#a3e635">D5 (PWM ENA) ──▶</text>
      <text y="36" fill="#cbd5e1">D6 (IN1)      ──▶</text>
      <text y="56" fill="#cbd5e1">D7 (IN2)      ──▶</text>
      <text y="76" fill="#cbd5e1">D8 (IN3)      ──▶</text>
      <text y="96" fill="#a3e635">D9 (PWM ENB)  ──▶</text>
    </g>
  </g>

  <!-- Wires from MCU to Motor Driver -->
  <path d="M 565 200 L 640 200" stroke="#a3e635" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="602" y="193" fill="#a3e635" font-family="monospace" font-size="9" text-anchor="middle">PWM Speed</text>

  <path d="M 565 240 L 640 240" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="602" y="233" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">Logic IN1-4</text>

  <!-- 3. DRIVER & ACTUATOR STAGE: L293D + MOTORS -->
  <g transform="translate(645, 90)">
    <rect width="215" height="280" rx="12" fill="url(#boxGrad)" stroke="rgba(244, 114, 182, 0.3)" stroke-width="1.5"/>
    <path d="M 0 12 Q 0 0 12 0 L 203 0 Q 215 0 215 12 L 215 40 L 0 40 Z" fill="rgba(244, 114, 182, 0.12)"/>
    <text x="16" y="25" fill="#f472b6" font-family="monospace" font-size="13" font-weight="700">L293D H-BRIDGE</text>
    <text x="16" y="36" fill="#94a3b8" font-family="sans-serif" font-size="9">MOTOR DRIVER IC</text>

    <!-- Sub components: Left Motor & Right Motor -->
    <g transform="translate(16, 55)">
      <!-- Left Motor -->
      <rect width="183" height="90" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="28" cy="45" r="16" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="28" y="49" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">M1</text>
      <text x="56" y="38" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="600">Left Gear Motor</text>
      <text x="56" y="55" fill="#94a3b8" font-family="sans-serif" font-size="10">OUT1 / OUT2 (PWM)</text>
      <text x="56" y="70" fill="#a3e635" font-family="monospace" font-size="9">12V Bi-directional</text>
    </g>

    <g transform="translate(16, 160)">
      <!-- Right Motor -->
      <rect width="183" height="90" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="28" cy="45" r="16" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="28" y="49" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">M2</text>
      <text x="56" y="38" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="600">Right Gear Motor</text>
      <text x="56" y="55" fill="#94a3b8" font-family="sans-serif" font-size="10">OUT3 / OUT4 (PWM)</text>
      <text x="56" y="70" fill="#a3e635" font-family="monospace" font-size="9">12V Bi-directional</text>
    </g>
  </g>

  <!-- Bottom Spec Bar -->
  <g transform="translate(40, 410)">
    <rect width="820" height="42" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)"/>
    <text x="20" y="25" fill="#94a3b8" font-family="monospace" font-size="11">
      <tspan fill="#a3e635">✔ VALIDATION:</tspan> Transient voltage protection via flyback diodes · Active deadband prevents motor stalls · Zero hardware burnout
    </text>
  </g>
</svg>
